# ====================================================================
# ARAFI API - UNIFIED CONFIGURATION PROFILE (LOCAL & PRODUCTION)
# ====================================================================
spring.application.name=arafi-api

# Server Execution Port Configuration
# Cloud Run automatically injects the variable 'PORT'. Locally, it boots on 8080.
server.port=${PORT:8080}

# ====================================================================
# DATABASE CONNECTIVITY LAYER (POSTGRESQL / NEON)
# ====================================================================
# If SPRING_DATASOURCE_URL is present, it uses it. Otherwise, it defaults to your local database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arafi?options=-c%20search_path%3Darafi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Transaction Mapping Schema Metrics
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=arafi
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hikari Connection Pool Scaling Optimizations
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ====================================================================
# PLATFORM SECURITY & TOKENS
# ====================================================================
# Stateless JWT Signature Verification Secret Key
# ALWAYS pass a massive, secure token in your live environment variable.
arafi.jwt.secret=${ARAFI_JWT_SECRET}

# ====================================================================
# INTERACTIVE PLATFORM DOCUMENTATION (SWAGGER / OPENAPI)
# ====================================================================
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ====================================================================
# NOMBA CREDENTIALS (FALLBACK RAIL — existing subscriptions only)
# ====================================================================
nomba.account.id=${NOMBA_ACCOUNT_ID}
nomba.sub.account.id=${NOMBA_SUB_ACCOUNT_ID}

nomba.test.client.id=${NOMBA_TEST_CLIENT_ID}
nomba.test.private.key=${NOMBA_TEST_PRIVATE_KEY}

nomba.live.client.id=${NOMBA_LIVE_CLIENT_ID}
nomba.live.private.key=${NOMBA_LIVE_PRIVATE_KEY}

# ====================================================================
# FLUTTERWAVE CREDENTIALS (PRIMARY CARD RAIL)
# Get from: https://app.flutterwave.com/dashboard/settings/apis
# ====================================================================
flutterwave.test.secret.key=${FLUTTERWAVE_TEST_SECRET_KEY:}
flutterwave.live.secret.key=${FLUTTERWAVE_LIVE_SECRET_KEY:}
flutterwave.base.url.test=https://developersandbox-api.flutterwave.com
flutterwave.base.url.live=https://api.flutterwave.com

# ====================================================================
# ALATPAY CREDENTIALS (PRIMARY BANK TRANSFER RAIL)
# Get from: https://business.alatpay.com/settings
# ====================================================================
alatpay.test.subscription.key=${ALATPAY_TEST_SUBSCRIPTION_KEY:}
alatpay.live.subscription.key=${ALATPAY_LIVE_SUBSCRIPTION_KEY:}
alatpay.business.id=${ALATPAY_BUSINESS_ID:}
alatpay.base.url=https://api.alatpay.com

# ====================================================================
# PAYSTACK CREDENTIALS (SECONDARY CARD RAIL + HIGH-VALUE NGN ROUTING)
# Get from: https://dashboard.paystack.com/#/settings/developers
# ====================================================================
paystack.test.secret.key=${PAYSTACK_TEST_SECRET_KEY:}
paystack.live.secret.key=${PAYSTACK_LIVE_SECRET_KEY:}

# ====================================================================
# RESILIENCE4J — Circuit Breaker & Timeout Configuration
# Hard 2,500ms timeout on all gateway calls to prevent checkout hangs.
# Circuit opens after 50% failure rate over a 10-request sliding window.
# ====================================================================
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.timelimiter.configs.default.timeout-duration=2500ms
resilience4j.timelimiter.configs.default.cancel-running-future=true

spring.profiles.active=test
